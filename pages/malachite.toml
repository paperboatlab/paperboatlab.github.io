# Malachite's page at /malachite/ (pages/app.html). Facts from malachite's README and its manual (/apps/malachite/).
label = "Malachite"
line = "An engineering notebook: notes, runs and results in one hub, with Julia and Python cells."
screenshot = ""   # the showcased features show the app
tags = ["Markdown", "Julia", "Python"]
runs = "Cells run in Paperboat's Julia and Python runtimes, in containers: nothing to install on the host but Paperboat and the app."
getting_started = "getting_started.html"

[[feature]]
title = "Notes and links"
text = "Markdown notes that link with [[name]] and carry their properties in a front matter. Beside each note: its backlinks, its outgoing links and the notes around it."
shot = "notes"

[[feature]]
title = "Julia and Python cells"
text = "Fenced julia and python blocks in a note run in the hub's session for that language; what a cell prints or draws stays under it."
shot = "cells"

[[feature]]
title = "Graph"
text = "Every note in the hub and the links between them, on one canvas, kept per hub."
shot = "graph"

[[feature]]
title = "The hub"
text = "A plain folder in any layout you choose, with its own files in one hidden .malachite folder. Simplicial, Articula and Julix open their files from it."

[[feature]]
title = "History"
text = "A version is kept as files change; restore one file, a folder or the whole hub."

[[feature]]
title = "Cloud hubs"
text = "Keep a hub in a folder Dropbox, OneDrive, Google Drive or iCloud Drive syncs; Malachite flags their conflict copies."

[[step]]
title = "Install it"
code = "paperboat app install malachite"
text = "Installing pulls the Julia and Python runtimes too."

[[step]]
title = "Open a folder as a hub"
code = "paperboat app open malachite ~/notes"
text = "A folder named here opens as a hub; its settings are written on first open. Without one it opens on the Start page."

[[step]]
title = "Write a note with a cell"
code = "# Step response\nSee [[tank-level]].\n\n```julia\nlevel = 5.0 .* (1 .- exp.(-(0:10) ./ 14))\n```"
text = "Link another note with [[name]], then run the cell."
