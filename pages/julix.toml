# Julix's page at /julix/ (pages/app.html). Facts from julix's README and its manual (/apps/julix/).
label = "Julix"
line = "A Julia workbench: scripts, a console, the session's variables and the figures your code draws, in one window."
screenshot = ""   # the showcased features show the app
tags = ["Julia"]
runs = "Your code runs in Paperboat's Julia runtime, in a container: nothing to install on the host but Paperboat and the app."
getting_started = "getting_started.html"

[[feature]]
title = "Scripts and cells"
text = "A folder of .jl scripts. F5 runs a script, Ctrl Enter the cell at the cursor (a cell starts at a ## line), Shift Enter a line."
shot = "scripts"

[[feature]]
title = "Results at the line, figures by run"
text = "Each line's result shows at its end: a sparkline for a vector, a heatmap for a matrix, a value, or a figure to open. Every figure is kept as a card under the run that drew it, with its thumbnail."
shot = "results"

[[feature]]
title = "Console and variables"
text = "The console runs an expression in the same session as your scripts. Variables lists what they left behind, with types, sizes and a preview, updated after every run."
shot = "variables"

[[feature]]
title = "Figures"
text = "What your code shows as SVG or PNG becomes a figure beside the editor, kept per run, to pan and zoom."
shot = "figures"

[[feature]]
title = "3D figures"
text = "JulixPlot draws 3D axes too: a surface or a curve you orbit with a drag, zoom with the wheel and snap to a side from the view cube."
shot = "figure3d"

[[feature]]
title = "Shared with Simplicial"
text = "While a Simplicial station runs, the session's variables show in its Variables card, and a block's setting can bind to one."

[[step]]
title = "Install it"
code = "paperboat channel beta\npaperboat app install julix"
text = "Installing pulls the Julia runtime too."

[[step]]
title = "Open a folder"
code = "paperboat app open julix ~/work/tank-level"
text = "A folder of .jl scripts, or a Malachite hub; the read-only examples are in every one. Without one it opens on the Start page."

[[step]]
title = "Run a cell"
code = "## A first cell\nx = range(0, 10; length = 100)\ny = sin.(x)"
text = "Put the cursor in the cell and press Ctrl Enter; x and y appear under Variables."
