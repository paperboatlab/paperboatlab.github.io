# Simplicial's page at /simplicial/ (pages/app.html). Facts from simplicial's README, its manual
# (/apps/simplicial/) and its commands.toml.
label = "Simplicial"
line = "Visual flow, station and block-diagram simulation: a C++20 engine, stations in C++, Python or Julia, and toolkits of blocks."
screenshot = ""   # the showcased features show the app
tags = ["C++", "Python", "Julia"]
runs = "The engine is C++20; Python and Julia stations run in Paperboat's runtimes, in containers."
getting_started = "getting_started.html"
note = "v0.1 is in beta, for Linux x86_64."

[[feature]]
title = "Setup"
text = "A 2D or 3D scene of the things in a station. Pick one to set its properties; a property can be bound to a variable."
shot = "setup"

[[feature]]
title = "Flow"
text = "A node graph of blocks that turns the setup into results: wire ports, set parameters. A setting takes a number, a variable or a formula of them."
shot = "flow"

[[feature]]
title = "Run"
text = "Watch it while it runs: the scene moves, the Board plots live values, and progress and logs follow along. Every run is kept."
shot = "run"

[[feature]]
title = "Stations and flows"
text = "A .pst is the station, in C++, Python or Julia. A .psf flow keeps only what it changes and finds its station by name and version."

[[feature]]
title = "Julix's variables"
text = "While Julix runs, its session's variables show under From Julix; a block's setting binds to one, as to any variable."

[[feature]]
title = "Toolkits"
text = "Optional packages of blocks: control, optimization, OpenCV and mesh operations."

[[step]]
title = "Install it"
code = "paperboat channel beta\npaperboat app install simplicial"
text = "It adds the station and run commands to the paperboat CLI."

[[step]]
title = "Open a folder"
code = "paperboat app open simplicial ~/flows"
text = "A folder or a Malachite hub. Without one it opens on the Start page; a .pst opens its station on a new flow."

[[step]]
title = "Run it"
code = "paperboat station list\npaperboat run <station>"
text = "The list shows the examples and the stations you have; run builds one if needed, starts it and opens it in Simplicial."
